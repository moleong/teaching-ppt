<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title><!-- 改：你的 PPT 標題 --></title>
<style>
  :root { --fs-scale: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft JhengHei", "PingFang TC", "Helvetica Neue", sans-serif;
    background: #1a1a2e;
    color: #f0f0f0;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  .deck { width: 100vw; height: 100vh; position: relative; }

  .slide {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    padding: 5vh 8vw;
    display: none; flex-direction: column;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }
  .slide.active { display: flex; animation: slideIn 0.4s ease-out; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* 揭曉後：整頁可捲動，內容從頂部排列，騰出最大空間給答案 */
  .slide.revealed {
    overflow-y: auto;
    justify-content: flex-start;
    padding-top: 3vh;
  }

  /* 封面 */
  .cover { align-items: center; text-align: center; background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); }
  .cover h1 {
    font-size: calc(5.5vw * var(--fs-scale)); font-weight: 700; margin-bottom: 3vh; letter-spacing: 0.05em;
    background: linear-gradient(90deg, #e94560, #f5a623);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .cover .subtitle { font-size: calc(2.2vw * var(--fs-scale)); color: #a0a0c0; margin-bottom: 6vh; }
  .cover .meta { font-size: calc(1.4vw * var(--fs-scale)); color: #707090; }

  /* 頁首 */
  .slide-header { display: flex; align-items: center; margin-bottom: 3vh; }
  .slide-tag {
    background: #e94560; color: white; padding: 0.5em 1.3em;
    border-radius: 4px; font-size: calc(1.3vw * var(--fs-scale)); font-weight: 600; margin-right: 1.5vw;
  }
  .slide-title { font-size: calc(2.2vw * var(--fs-scale)); font-weight: 600; }

  /* 通用內容 */
  .content { font-size: calc(1.9vw * var(--fs-scale)); line-height: 1.75; }
  .content p { margin-bottom: 1.6vh; }
  .content ul, .content ol { list-style: none; margin: 1vh 0; }
  .content ul li, .content ol li { padding-left: 2vw; text-indent: -2vw; margin-bottom: 1.2vh; }
  .content ul li::before { content: "▸"; color: #f5a623; margin-right: 0.6em; }
  .content ol { counter-reset: item; }
  .content ol li { counter-increment: item; }
  .content ol li::before { content: counter(item) ". "; color: #f5a623; font-weight: 600; margin-right: 0.4em; }

  /* 重點標記 */
  .em     { color: #f5a623; font-weight: 600; }
  .danger { color: #e94560; font-weight: 600; }
  .ok     { color: #2ecc71; font-weight: 600; }
  .blue   { color: #4ecdc4; font-weight: 600; }

  /* 填空（答案預設隱藏，.revealed 後顯示） */
  .blank {
    display: inline-block; min-width: 8em; padding: 0 0.4em;
    border-bottom: 3px solid #f5a623; color: transparent;
    transition: color 0.4s ease; text-align: center;
    cursor: pointer;
  }
  .blank.show, .revealed .blank { color: #f5a623; background: rgba(245, 166, 35, 0.12); border-radius: 4px; }

  /* 概念卡片 */
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; margin-top: 2vh; }
  .card { background: rgba(255,255,255,0.05); border-left: 5px solid #f5a623; padding: 2.5vh 2vw; border-radius: 6px; }
  .card.r1 { border-left-color: #e94560; }
  .card.r2 { border-left-color: #2ecc71; }
  .card-title { font-size: calc(1.7vw * var(--fs-scale)); color: #f5a623; font-weight: 600; margin-bottom: 1.5vh; }
  .card.r1 .card-title { color: #e94560; }
  .card.r2 .card-title { color: #2ecc71; }
  .card-body { font-size: calc(1.6vw * var(--fs-scale)); line-height: 1.7; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; margin-top: 2vh; font-size: calc(1.6vw * var(--fs-scale)); }
  th, td { padding: 1.5vh 1.5vw; border: 1px solid rgba(255,255,255,0.15); text-align: center; }
  th { background: rgba(233,69,96,0.25); color: #ffb4c1; font-weight: 600; }
  td.label { background: rgba(245,166,35,0.15); color: #f5a623; font-weight: 600; }

  /* 提示 / 警示 */
  .callout { background: rgba(245,166,35,0.1); border-left: 5px solid #f5a623; padding: 2vh 2vw; border-radius: 6px; font-size: calc(1.6vw * var(--fs-scale)); margin-top: 2vh; line-height: 1.7; max-height: 55vh; overflow-y: auto; }
  .callout.danger { background: rgba(233,69,96,0.1); border-left-color: #e94560; }
  .callout.ok     { background: rgba(46,204,113,0.1); border-left-color: #2ecc71; }
  .callout-title  { font-weight: 700; margin-right: 0.5em; }
  .callout::-webkit-scrollbar { width: 6px; }
  .callout::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
  .callout::-webkit-scrollbar-thumb { background: rgba(245,166,35,0.4); border-radius: 3px; }
  /* 揭曉後 callout 不限高度，讓長解析完整展開 */
  .slide.revealed .callout { max-height: none; }

  /* 公式 */
  .formula { font-family: "Cambria Math", "Latin Modern Math", serif; font-size: calc(2.0vw * var(--fs-scale)); color: #f5a623; text-align: center; margin: 2vh 0; padding: 2vh 0; background: rgba(245,166,35,0.08); border-radius: 8px; }
  .big-formula { font-size: calc(3.2vw * var(--fs-scale)); font-family: "Cambria Math", "Latin Modern Math", serif; color: #f5a623; text-align: center; margin: 3vh 0; padding: 3vh 3vw; background: rgba(245,166,35,0.08); border: 2px solid rgba(245,166,35,0.3); border-radius: 12px; }

  /* 題目區 */
  .question { font-size: calc(1.8vw * var(--fs-scale)); line-height: 1.8; }
  .question-num { color: #e94560; font-weight: 700; font-size: calc(2vw * var(--fs-scale)); }
  .sub-q { color: #4ecdc4; font-weight: 600; }

  /* 答案區 */
  .answer-box { margin-top: 2vh; }
  .answer-box.hidden { display: none !important; }
  .answer-step { margin-bottom: 1.5vh; }
  .step-num { color: #f5a623; font-weight: 600; }

  /* 兩欄佈局 */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; align-items: center; margin-top: 2vh; }
  .two-col-top { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; margin-top: 2vh; }

  /* 揭曉後：題目區域縮小，騰出空間給答案 */
  .slide.revealed .question { font-size: calc(1.5vw * var(--fs-scale)); line-height: 1.5; }
  .slide.revealed .question p { margin-bottom: 0.6vh; }
  .slide.revealed .diagram { max-height: 15vh; }

  /* 揭曉提示 */
  .reveal-hint { position: absolute; bottom: 10vh; left: 50%; transform: translateX(-50%); color: #707090; font-size: calc(1.2vw * var(--fs-scale)); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  .hidden { display: none !important; }
  .invisible { visibility: hidden; }
  .reveal-step { opacity: 0; transform: translateY(20px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .reveal-step.visible { opacity: 1; transform: translateY(0); }



  /* SVG 圖 */
  .diagram { margin: 2vh auto; display: block; }

  /* 目錄 */
  .toc { list-style: none; font-size: calc(2.6vw * var(--fs-scale)); line-height: 2.4; }
  .toc li { padding-left: 5vw; text-indent: -5vw; margin-bottom: 1vh; }
  .toc .num { display: inline-block; width: 4vw; color: #e94560; font-weight: 700; }
  .toc .desc { color: #a0a0c0; font-size: calc(1.6vw * var(--fs-scale)); margin-left: 1em; }

  /* 總結頁 */
  .summary-list { list-style: none; font-size: calc(1.8vw * var(--fs-scale)); line-height: 2; }
  .summary-list li { padding-left: 3vw; position: relative; margin-bottom: 1.5vh; }
  .summary-list li::before { content: "✓"; position: absolute; left: 0; color: #2ecc71; font-weight: bold; }

  /* 彈簧示意（可選） */
  .spring-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; margin: 2vh 0; text-align: center; }
  .spring-state { padding: 2vh 1vw; background: rgba(255,255,255,0.04); border-radius: 8px; }
  .spring-state .label { font-size: calc(1.5vw * var(--fs-scale)); color: #f5a623; margin-bottom: 1vh; font-weight: 600; }
  .spring-state .desc { font-size: calc(1.3vw * var(--fs-scale)); color: #a0a0c0; margin-top: 1vh; }

  /* 底部 HUD */
  .hud { position: fixed; bottom: 2vh; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 3vw; pointer-events: none; z-index: 100; }
  .progress { flex: 1; height: 3px; background: rgba(255,255,255,0.1); margin: 0 2vw; border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #e94560, #f5a623); transition: width 0.3s ease; }
  .counter { font-size: calc(1.2vw * var(--fs-scale)); color: #707090; min-width: 4em; text-align: center; }
  .controls-hint { font-size: calc(1vw * var(--fs-scale)); color: #505070; text-align: right; }

  /* iPad 直向適配 */
  @media (orientation: portrait) {
    .slide { padding: 4vh 6vw; }
    .cover h1 { font-size: calc(9vw * var(--fs-scale)); } .cover .subtitle { font-size: calc(3.5vw * var(--fs-scale)); } .cover .meta { font-size: calc(2.4vw * var(--fs-scale)); }
    .slide-tag { font-size: calc(2.6vw * var(--fs-scale)); } .slide-title { font-size: calc(3.6vw * var(--fs-scale)); }
    .content { font-size: calc(3vw * var(--fs-scale)); } .card-grid { grid-template-columns: 1fr; }
    .card-title { font-size: calc(3vw * var(--fs-scale)); } .card-body { font-size: calc(2.7vw * var(--fs-scale)); }
    table { font-size: calc(2.6vw * var(--fs-scale)); } .callout { font-size: calc(2.7vw * var(--fs-scale)); max-height: 70vh; }
    .formula { font-size: calc(3.2vw * var(--fs-scale)); } .big-formula { font-size: calc(5vw * var(--fs-scale)); padding: 2.5vh 2.5vw; }
    .question { font-size: calc(3vw * var(--fs-scale)); } .toc { font-size: calc(4vw * var(--fs-scale)); } .toc .desc { font-size: calc(2.6vw * var(--fs-scale)); } .summary-list { font-size: calc(2.8vw * var(--fs-scale)); }
    .two-col { grid-template-columns: 1fr; } .two-col-top { grid-template-columns: 1fr 1fr; } .spring-row { grid-template-columns: 1fr; }
    .spring-state .label { font-size: calc(2.6vw * var(--fs-scale)); } .spring-state .desc { font-size: calc(2.2vw * var(--fs-scale)); }
    .reveal-hint { font-size: calc(2.4vw * var(--fs-scale)); bottom: 8vh; } .counter { font-size: calc(2vw * var(--fs-scale)); } .controls-hint { font-size: calc(1.8vw * var(--fs-scale)); }
    .slide.revealed .question { font-size: calc(2.4vw * var(--fs-scale)); }
    .slide.revealed .diagram { max-height: 12vh; }
    .slide.revealed .callout { font-size: calc(2.4vw * var(--fs-scale)); }
  }
  @media (max-width: 480px) { .cover h1 { font-size: calc(11vw * var(--fs-scale)); } .content { font-size: calc(4vw * var(--fs-scale)); } .controls-hint { font-size: 0; } }

  /* 右上角控制按鈕組（字體縮放 + 全屏） */
  .ctrl-group {
    position: fixed; top: 2vh; right: 2vw;
    display: flex; gap: 0.5vw;
    z-index: 200;
  }
  .ctrl-btn {
    width: 3.5vw; height: 3.5vw; min-width: 36px; min-height: 36px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #f0f0f0; font-family: inherit;
    font-size: calc(1.4vw * var(--fs-scale)); font-weight: 600;
    transition: background 0.2s, transform 0.1s;
    padding: 0; line-height: 1;
  }
  .ctrl-btn:hover { background: rgba(245,166,35,0.3); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn svg { width: 55%; height: 55%; fill: #f0f0f0; }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn:disabled:hover { background: rgba(255,255,255,0.08); }

  /* iOS 提示氣泡 */
  .ios-tip {
    position: fixed; top: 7vh; right: 2vw;
    background: rgba(15, 52, 96, 0.95); color: #f0f0f0;
    padding: 1.8vh 2vw; border-radius: 8px;
    font-size: calc(1.2vw * var(--fs-scale)); line-height: 1.6; max-width: 30vw;
    z-index: 199; border-left: 4px solid #f5a623;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    opacity: 0; transform: translateY(-10px); pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .ios-tip.show { opacity: 1; transform: translateY(0); }
  .ios-tip strong { color: #f5a623; }
  .ios-tip .close { float: right; cursor: pointer; color: #a0a0c0; margin-left: 1em; }
  .ios-tip .close:hover { color: #f0f0f0; }

  /* 列印模式 */
  @media print {
    html, body { background: white; color: black; height: auto; overflow: visible; }
    .slide { display: flex !important; page-break-after: always; position: relative; background: white !important; color: black; height: 100vh; }
    .hud, .reveal-hint, .ctrl-group, .ios-tip { display: none; }
    .reveal-step { opacity: 1 !important; transform: none !important; }
    [data-answer].hidden { display: block !important; }
    .card, .callout, .formula, .big-formula { background: #f5f5f5 !important; color: black; }
    .blank, .blank.show { color: #d35400; }
  }
</style>
</head>
<body>

<div class="deck" id="deck">

  <!-- ========================================= -->
  <!-- 範例 1：封面 slide -->
  <!-- ========================================= -->
  <!-- 用法：改 h1 大標題、subtitle、meta 即可 -->
  <section class="slide cover active">
    <h1><!-- 填寫：你的大標題 --></h1>
    <div class="subtitle"><!-- 填寫：副標題 · 用途 --></div>
    <div class="meta"><!-- 填寫：學科 · 單元 --></div>
  </section>

  <!-- ========================================= -->
  <!-- 範例 2：概念講解 slide（兩欄卡片 + 內容） -->
  <!-- ========================================= -->
  <!-- 用法：複製並增減 .card；可改用 .content > ul/ol 列點 -->
  <section class="slide">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤文字（如 "一、xxx"） --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <div class="card-grid">
      <div class="card r1">
        <div class="card-title"><!-- 填寫：左卡標題 --></div>
        <div class="card-body"><!-- 填寫：左卡內容 --></div>
      </div>
      <div class="card r2">
        <div class="card-title"><!-- 填寫：右卡標題 --></div>
        <div class="card-body"><!-- 填寫：右卡內容 --></div>
      </div>
    </div>

    <div class="content">
      <!-- 填寫：補充說明，可用 ul > li 列點 -->
    </div>
  </section>

  <!-- ========================================= -->
  <!-- 範例 3：填空題 slide（點擊 / Space 揭曉答案） -->
  <!-- ========================================= -->
  <!-- 用法：data-reveal="true" 啟用揭曉機制 -->
  <!-- .blank 的文字是答案（預設透明，.revealed 後顯示） -->
  <section class="slide" data-reveal="true">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤 --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <div class="callout">
      <!-- 填寫：題目 -->
      <!-- 用 <span class="blank" data-fill="答案文字">答案文字</span> 包起填空處 -->
    </div>

    <div class="reveal-hint" data-hint>按 空格鍵 / 點擊 顯示填空答案</div>
  </section>

  <!-- ========================================= -->
  <!-- 範例 4：題目 + 解析 slide（.answer-box 隱藏，揭曉後顯示） -->
  <!-- ========================================= -->
  <!-- 用法：適合課堂練習 / 判斷題 -->
  <section class="slide" data-reveal="true">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤（如 "題 1"） --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <!-- 題目區 -->
    <div class="callout">
      <!-- 填寫：題目文字，可用 ul > li 列選項 -->
    </div>

    <div class="reveal-hint" data-hint>按 空格鍵 / 點擊 顯示答案</div>

    <!-- 答案區（預設 hidden，揭曉後顯示） -->
    <div class="callout ok hidden" data-answer>
      <span class="callout-title">正確答案：</span>
      <!-- 填寫：答案與解析 -->
    </div>
  </section>

  <!-- ========================================= -->
  <!-- 範例 5：SVG 圖示 slide（兩欄：左圖右文） -->
  <!-- ========================================= -->
  <!-- 用法：SVG 內聯繪製，不使用外部圖片 -->
  <!-- 常用元素：path（曲線）、line（軸）、circle（點）、text（標籤） -->
  <section class="slide">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤 --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <div class="two-col">
      <div>
        <!-- 填寫：SVG 圖示 -->
        <!-- 參考範例：力學圖、電路圖、勢能曲線等 -->
        <svg class="diagram" viewBox="0 0 480 300" width="100%" style="max-width:520px;">
          <!-- 示例：座標軸 -->
          <line x1="60" y1="20" x2="60" y2="285" stroke="#a0a0c0" stroke-width="2"/>
          <line x1="40" y1="200" x2="465" y2="200" stroke="#a0a0c0" stroke-width="2"/>
          <!-- 填寫：繪製你的圖形 -->
        </svg>
      </div>
      <div class="content">
        <!-- 填寫：圖示說明文字 -->
      </div>
    </div>
  </section>

  <!-- ========================================= -->
  <!-- 範例 6：總結 slide -->
  <!-- ========================================= -->
  <section class="slide">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤（如 "總結"） --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <ul class="summary-list">
      <!-- 填寫：總結要點，每條一個 li -->
      <!-- 用 <span class="em">關鍵詞</span> 標亮重點 -->
    </ul>
  </section>

  <!-- ========================================= -->
  <!-- 範例 7：逐步顯示 slide（Space 每下顯示一個區塊） -->
  <!-- ========================================= -->
  <!-- 用法：data-step-reveal="true" 啟用逐步顯示 -->
  <!-- 每個 .reveal-step 是一個區塊，按 Space 逐一顯示 -->
  <!-- 全部顯示後再按 Space 才進入下一頁 -->
  <section class="slide" data-step-reveal="true">
    <div class="slide-header">
      <span class="slide-tag"><!-- 填寫：標籤 --></span>
      <span class="slide-title"><!-- 填寫：頁標題 --></span>
    </div>

    <div class="reveal-step">
      <!-- 第一個區塊：問題描述或第一個概念 -->
    </div>

    <div class="reveal-step">
      <!-- 第二個區塊：例子或深入說明 -->
    </div>

    <div class="reveal-step">
      <!-- 第三個區塊：總結或結論 -->
    </div>

    <div class="reveal-hint" data-hint>按 空格鍵 / 點擊 逐步揭曉</div>
  </section>

  <!-- ========================================= -->
  <!-- 額外 slide 區（複製上方範例增減） -->
  <!-- ========================================= -->
  <!-- 提示：
    - 純文字內容 slide：不要 data-reveal，直接用 .content > ul/ol
    - 表格 slide：用 <table> + th（標題行）+ td（內容行）
    - 公式 slide：用 .big-formula（大標題級）或 .formula（行內級）
    - 目錄 slide：用 .toc > li 列舉
    - 逐步顯示 slide：用 data-step-reveal + .reveal-step 包裹每個區塊
  -->

</div>

<!-- 右上角控制按鈕組（字體縮放 + 全屏） -->
<div class="ctrl-group">
  <button class="ctrl-btn" id="zoomOut" aria-label="字體縮小">A−</button>
  <button class="ctrl-btn" id="zoomReset" aria-label="重置字體">100%</button>
  <button class="ctrl-btn" id="zoomIn" aria-label="字體放大">A+</button>
  <button class="ctrl-btn" id="fsBtn" aria-label="切換全屏">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/>
    </svg>
  </button>
</div>

<!-- iPad / iOS 提示氣泡 -->
<div class="ios-tip" id="iosTip" role="alert">
  <span class="close" id="iosTipClose" aria-label="關閉提示">✕</span>
  <strong>iPad / iPhone 全屏限制</strong><br>
  iOS Safari 不支援網頁全屏按鈕。請點 Safari 下方 <strong>分享 → 加到主畫面</strong>，從主畫面圖示啟動即可全屏播放。
</div>

<!-- 底部 HUD（勿刪） -->
<div class="hud">
  <div class="counter" id="counter">1 / 6</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="controls-hint">← → / 滑動 切換頁 · Space / 點擊 揭曉填空 · F 全螢幕 · +/− 縮放字體</div>
</div>

<script>
(function() {
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let current = 0;

  const counter = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');

  function render() {
    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    counter.textContent = (current + 1) + ' / ' + total;
    progressBar.style.width = ((current + 1) / total * 100) + '%';
  }

  function reveal() {
    const slide = slides[current];
    slide.classList.add('revealed');
    const ans = slide.querySelector('[data-answer]');
    if (ans) ans.classList.remove('hidden');
    const hint = slide.querySelector('[data-hint]');
    if (hint) hint.classList.add('hidden');
  }

  // 離開當前頁時呼叫:若該頁是揭曉題且已揭曉,重置為 fresh 狀態
  // 結果:無論按 ← 或 → 離開揭曉頁,下次回來都要重新 Space 揭曉
  function resetCurrentReveal() {
    const slide = slides[current];
    if (slide.dataset.reveal === 'true') {
      slide.classList.remove('revealed');
      const ans = slide.querySelector('[data-answer]');
      if (ans) ans.classList.add('hidden');
      const hint = slide.querySelector('[data-hint]');
      if (hint) hint.classList.remove('hidden');
    }
  }

  // 逐次展示
  function advanceStepReveal() {
    const slide = slides[current];
    if (slide.dataset.stepReveal !== 'true') return false;
    const steps = slide.querySelectorAll('.reveal-step');
    for (let i = 0; i < steps.length; i++) {
      if (!steps[i].classList.contains('visible')) {
        steps[i].classList.add('visible');
        return true;
      }
    }
    return false;
  }

  function resetStepReveal() {
    const slide = slides[current];
    if (slide.dataset.stepReveal === 'true') {
      slide.querySelectorAll('.reveal-step').forEach(s => s.classList.remove('visible'));
      const hint = slide.querySelector('[data-hint]');
      if (hint) hint.classList.remove('hidden');
    }
  }

  // 前進專鍵（→ / PageDown / 右鍵 / 左滑）：直接翻頁，不停留在中間揭曉狀態
  function skipNext() {
    advance();
  }

  function advance() {
    if (current < total - 1) {
      resetCurrentReveal();
      resetStepReveal();
      current++;
      render();
    }
  }

  function prev() {
    if (current > 0) {
      resetCurrentReveal();
      resetStepReveal();
      current--;
      render();
    }
  }

  // 揭曉題上 Space/點擊:已揭曉則隱藏、未揭曉則揭曉(toggle)
  // 非揭曉題上 Space/點擊:直接前進
  // 前進專鍵:→ / 右鍵 / 左滑
  function toggleOrNext() {
    const slide = slides[current];
    if (slide.dataset.stepReveal === 'true') {
      if (advanceStepReveal()) return;
      advance();
      return;
    }
    if (slide.dataset.reveal === 'true') {
      if (slide.classList.contains('revealed')) {
        resetCurrentReveal();   // 已揭曉 → 隱藏(留在當頁)
      } else {
        reveal();               // 未揭曉 → 揭曉
      }
    } else {
      advance();                // 非揭曉題 → 前進
    }
  }

  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowRight': case 'PageDown': e.preventDefault(); skipNext(); break;
      case 'ArrowLeft':  case 'PageUp':   e.preventDefault(); prev(); break;
      case ' ': case 'Enter': e.preventDefault(); toggleOrNext(); break;
      case 'Home': e.preventDefault(); resetCurrentReveal(); resetStepReveal(); current = 0; render(); break;
      case 'End': e.preventDefault(); resetCurrentReveal(); resetStepReveal(); current = total - 1; render(); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case '+': case '=': e.preventDefault(); applyZoom(currentZoom + ZOOM_STEP); break;
      case '-': case '_': e.preventDefault(); applyZoom(currentZoom - ZOOM_STEP); break;
      case '0': e.preventDefault(); applyZoom(1.0); break;
    }
  });

  // ===== 字體縮放 =====
  const zoomInBtn = document.getElementById('zoomIn');
  const zoomOutBtn = document.getElementById('zoomOut');
  const zoomResetBtn = document.getElementById('zoomReset');
  const ZOOM_MIN = 0.7, ZOOM_MAX = 1.6, ZOOM_STEP = 0.1;
  let currentZoom = 1.0;

  function applyZoom(z) {
    z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z * 100) / 100));
    currentZoom = z;
    document.documentElement.style.setProperty('--fs-scale', z);
    zoomResetBtn.textContent = Math.round(z * 100) + '%';
    zoomInBtn.disabled = z >= ZOOM_MAX;
    zoomOutBtn.disabled = z <= ZOOM_MIN;
  }

  zoomInBtn.addEventListener('click', (e) => { e.stopPropagation(); applyZoom(currentZoom + ZOOM_STEP); });
  zoomOutBtn.addEventListener('click', (e) => { e.stopPropagation(); applyZoom(currentZoom - ZOOM_STEP); });
  zoomResetBtn.addEventListener('click', (e) => { e.stopPropagation(); applyZoom(1.0); });

  // ===== 全屏切換 + iOS 提示 =====
  function isIOSorIPadOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  const fsBtn = document.getElementById('fsBtn');
  const iosTip = document.getElementById('iosTip');
  const iosTipClose = document.getElementById('iosTipClose');
  let iosTipTimer = null;

  function showIOSTip() {
    iosTip.classList.add('show');
    clearTimeout(iosTipTimer);
    iosTipTimer = setTimeout(() => iosTip.classList.remove('show'), 6000);
  }

  function toggleFullscreen() {
    if (isIOSorIPadOS() || !document.documentElement.requestFullscreen) {
      showIOSTip();
      return;
    }
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => showIOSTip());
    } else {
      document.exitFullscreen();
    }
  }

  fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
  iosTipClose.addEventListener('click', (e) => {
    e.stopPropagation();
    iosTip.classList.remove('show');
    clearTimeout(iosTipTimer);
  });

  // 觸控
  let touchStartX = 0, touchStartY = 0, touchStartT = 0, isSwiping = false;
  const SWIPE_THRESHOLD = 50, SWIPE_MAX_TIME = 600;

  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('.hud, .ctrl-group, .ios-tip')) return;
    const t = e.touches[0]; touchStartX = t.clientX; touchStartY = t.clientY; touchStartT = Date.now(); isSwiping = false;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (touchStartT === 0) return;
    const t = e.touches[0];
    if (Math.abs(t.clientX - touchStartX) > 10 || Math.abs(t.clientY - touchStartY) > 10) isSwiping = true;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (touchStartT === 0) return;
    const elapsed = Date.now() - touchStartT;
    const t = e.changedTouches[0]; const dx = t.clientX - touchStartX; const dy = t.clientY - touchStartY;
    touchStartT = 0;
    if (isSwiping && elapsed < SWIPE_MAX_TIME && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
      e.preventDefault(); dx < 0 ? skipNext() : prev();
    }
  }, { passive: false });

  document.addEventListener('click', (e) => {
    if (e.target.closest('.hud, .ctrl-group, .ios-tip')) return;
    if (isSwiping) { isSwiping = false; return; }
    toggleOrNext();
  });

  // 右鍵點擊:前進(攔截 browser context menu)
  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.hud, .ctrl-group, .ios-tip')) return;
    e.preventDefault();
    skipNext();
  });

  // 單個填空點擊顯示/隱藏（不影響頁面切換）
  document.querySelectorAll('.blank').forEach(function(blank) {
    blank.addEventListener('click', function(e) {
      e.stopPropagation();
      this.classList.toggle('show');
    });
  });

  render();
})();
</script>

</body>
</html>
